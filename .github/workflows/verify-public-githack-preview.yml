name: Verify public no-login RA website preview
on:
  push:
    branches: [preview-discovery-gallery-20261103]
    paths:
      - '.github/workflows/verify-public-githack-preview.yml'
  workflow_dispatch:
jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core
      - name: Test real public preview in Chrome without Vercel login
        run: |
          node <<'JS'
          const puppeteer=require('puppeteer-core');
          const assert=require('node:assert/strict');
          const base='https://raw.githack.com/RA-perfumes/RA-perfumes/f9989a9eac616a6361d24e43b10d2072a02d9dca/';
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-setuid-sandbox']});
            try{
              const page=await browser.newPage();
              await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
              const pageerrors=[];page.on('pageerror',e=>pageerrors.push(e.message));
              const result=await page.goto(base+'index.html',{waitUntil:'domcontentloaded',timeout:30000});
              assert.equal(result.status(),200);
              console.log('REMOTE PAGE DEBUG',JSON.stringify(await page.evaluate(()=>({
                url:location.href,
                title:document.title,
                gifts:document.querySelectorAll('#diwali-gallery').length,
                arrows:document.querySelectorAll('.diwali-next').length,
                body:(document.body?.innerText||'').slice(0,440),
                html:(document.documentElement?.outerHTML||'').slice(0,220)
              }))));
              if((await page.title()).includes('External Content Notice')){
                const links=await page.$eval('a',els=>els.map(a=>({text:a.textContent.trim(),href:a.href})));
                console.log('NOTICE LINKS',JSON.stringify(links.slice(0,12)));
                const button=await page.$$('a,button');
                for(const handle of button){
                  const label=await handle.evaluate(e=>e.textContent.trim());
                  if(label.toLowerCase().includes('open the page')){await handle.click();break}
                }
                await new Promise(resolve=>setTimeout(resolve,1200));
                console.log('AFTER NOTICE',JSON.stringify(await page.evaluate(()=>({title:document.title,url:location.href,gifts:document.querySelectorAll('#diwali-gallery').length}))));
              }
              await page.waitForSelector('#diwali-gallery .diwali-next',{timeout:20000});
              const visibility=await page.evaluate(()=>{
                const next=document.querySelector('#diwali-gallery .diwali-next');
                const gift=document.querySelector('#diwali-gallery-track img');
                return {nextVisible:getComputedStyle(next).display!=='none',giftImage:gift.getAttribute('src'),title:document.title};
              });
              assert(visibility.nextVisible);
              assert(visibility.giftImage.includes('diwali-closed.jpg'));
              await page.$eval('#diwali-gallery .diwali-next',el=>el.click());
              await page.waitForFunction(()=>document.querySelector('#diwali-gallery-track').scrollLeft>75,{timeout:10000});
              await page.evaluateOnNewDocument(()=>localStorage.setItem('ra-presence-selection',JSON.stringify([{id:'fresh',size:50,qty:1}])));
              const checkout=await page.goto(base+'checkout.html',{waitUntil:'domcontentloaded',timeout:30000});
              assert.equal(checkout.status(),200);
              await page.waitForSelector('#customer-mobile',{timeout:15000});
              const data=await page.evaluate(()=>({
                inputPattern:document.querySelector('#customer-mobile').pattern,
                errorText:document.querySelector('#mobile-error').textContent,
                scriptSrc:document.querySelector('script[src*="app.js"]')?.src
              }));
              assert.equal(data.inputPattern,'[6-9][0-9]{9}');
              assert.equal(data.errorText.trim(),'Invalid number');
              assert(data.scriptSrc.includes('raw.githack.com'));
              assert.deepEqual(pageerrors,[],pageerrors.join('; '));
              console.log('PUBLIC PREVIEW VERIFIED:',base+'index.html');
              console.log('CHECKOUT VERIFIED:',base+'checkout.html');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
