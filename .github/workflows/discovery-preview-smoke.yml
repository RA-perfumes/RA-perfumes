name: RA Perfumes Brand Preview Browser Test
on:
  push:
    branches: [preview-discovery-gallery-20261103]
    paths:
      - 'app.js'
      - 'styles.css'
      - 'the-scent.html'
      - '.github/workflows/discovery-preview-smoke.yml'
  workflow_dispatch:
jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock puppeteer-core
      - name: Test photo replacements, box showcase, product detail and cart
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ra-test.log 2>&1 &
          node <<'JS'
          const puppeteer=require('puppeteer-core');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await puppeteer.launch({
              headless:true,executablePath:'/usr/bin/google-chrome',
              args:['--no-sandbox','--disable-setuid-sandbox']
            });
            try {
              const page=await browser.newPage();
              await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:2});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const base='http://127.0.0.1:8765/';
              await page.goto(base+'the-scent.html',{waitUntil:'load'});
              const cards=await page.$$eval('.catalog-card h3',els=>els.map(x=>x.textContent.trim()));
              assert.deepEqual(cards,['ILAVEYIL','IRAVÉ','French Rose Oud','Discovery Set']);
              const descriptions=await page.$$eval('.catalog-card p',els=>els.map(x=>x.textContent.trim()));
              assert.deepEqual(descriptions.slice(0,3),[
                'Sweet-lime freshness that captures the feeling of a new morning.',
                'A soft sweetness that unfolds into warmth as evening settles.',
                'Soft rose petals unfolding into the rich warmth of oud.'
              ]);
              assert.equal(await page.$$eval('#box-gallery-track img',els=>els.length),2);
              await page.click('#box-showcase [data-box-step="1"]');
              await page.waitForFunction(()=>document.querySelector('#box-gallery-track').scrollLeft>70);
              console.log('PASS: two-box showcase and all new collection names');
              await page.click('#discovery-set');
              await page.waitForFunction(()=>location.search.includes('scent=discovery'));
              await page.waitForFunction(()=>!document.querySelector('.scent-shop').hidden);
              await page.waitForFunction(()=>document.querySelector('#product-image').naturalWidth>0);
              const set=await page.evaluate(()=>({
                title:document.querySelector('#product-title').textContent,
                price:document.querySelector('#product-price').textContent,
                original:document.querySelector('#product-original').textContent,
                src:document.querySelector('#product-image').getAttribute('src'),
                imageVisible:getComputedStyle(document.querySelector('#product-image')).display!=='none',
                gallery:document.querySelector('#discovery-gallery'),
                frameHeight:document.querySelector('.product-art').getBoundingClientRect().height
              }));
              assert.equal(set.title,'Discovery Set');
              assert.equal(set.price,'₹199');assert.equal(set.original,'₹399');
              assert(set.src.endsWith('discovery-set-new.jpg'));
              assert(set.imageVisible&&set.frameHeight>200,'product photo must be visible');
              assert.equal(set.gallery,null,'Discovery product must have only a single image');
              await page.click('#add-selection');
              await page.waitForSelector('#bag-dialog[open]');
              await page.keyboard.press('Escape');
              for(const [key,name,photo] of [
                ['fresh','ILAVEYIL','ilaveyil-new.jpg'],
                ['arena','IRAVÉ','irave-new.jpg'],
                ['oud','French Rose Oud','french-rose-oud-new.jpg']
              ]) {
                await page.goto(base+'the-scent.html?scent='+key,{waitUntil:'load'});
                await page.waitForFunction(()=>!document.querySelector('.scent-shop').hidden);
                const p=await page.evaluate(()=>({
                  name:document.querySelector('#product-title').textContent,
                  src:document.querySelector('#product-image').getAttribute('src')
                }));
                assert.equal(p.name,name);assert(p.src.endsWith(photo));
              }
              assert.deepEqual(errors,[],'Browser JavaScript errors');
              console.log('PASS: static discovery image, correct prices, all three new details and Add to Bag');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
